# Feature-set note (distribution matrix): the rust plugin builds the DEFAULT
# feature set (ssh,telnet), matching packaging/debian/rules (DEB proven).
# The Flatpak recipe (packaging/flatpak/...) is the intentional exception
# and builds `--all-features`. Keep this divergence when touching the build.
name: remote-app
base: core22
version: '0.1.0'
summary: Secure native remote computing client
description: |
  Native SSH, SFTP, Telnet, VNC, RDP, serial, and terminal client.
grade: devel
confinement: strict
architectures:
  - build-on: amd64
  - build-on: arm64
apps:
  remote-app:
    command: bin/remote-app
    plugs: [network, network-bind, home, ssh-keys, password-manager-service, opengl, x11, wayland]
  remote-app-headless:
    command: bin/remote-app-headless
    plugs: [network, network-bind, home, ssh-keys, password-manager-service]
parts:
  remote-app:
    plugin: rust
    source: ../..
    # libc6-dev supplies the C runtime startup objects (Scrt1.o, crti.o) that
    # the rust plugin's linker needs; minimal build environments may lack it.
    build-packages: [libc6-dev, pkg-config, libdbus-1-dev, libudev-dev, libx11-dev, libwayland-dev]
    stage-packages: [libdbus-1-3, libudev1]
