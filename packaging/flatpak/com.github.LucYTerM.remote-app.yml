app-id: com.github.LucYTerM.remote-app
runtime: org.freedesktop.Platform
runtime-version: "25.08"
sdk: org.freedesktop.Sdk
# The freedesktop SDK ships no Rust toolchain; the stable extension
# provides cargo for the build module below. 24.08 is EOL, hence 25.08.
# sdk-extensions entries take the full runtime ref: flatpak-builder 1.4
# concatenates a bare "id//branch" form into a malformed triple ref.
sdk-extensions:
  - runtime/org.freedesktop.Sdk.Extension.rust-stable/x86_64/25.08
command: remote-app
finish-args:
  - --share=network
  - --socket=x11
  - --socket=wayland
  - --socket=ssh-auth
  - --device=dri
  - --filesystem=home
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.secrets
modules:
  - name: remote-app
    build-options:
      build-args:
        - --share=network
      # cargo comes from the rust-stable SDK extension, not the base SDK.
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        MBXT_DEFAULT_CHANNEL: nightly
        CARGO_HOME: /run/build/remote-app/cargo-home
    buildsystem: simple
    build-commands:
      - cargo build --release --locked --all-features
      - install -Dm755 target/release/remote-app /app/bin/remote-app
      - install -Dm644 assets/remote-app.desktop /app/share/applications/remote-app.desktop
      - install -Dm644 assets/remote-app.metainfo.xml /app/share/metainfo/com.github.LucYTerM.remote-app.metainfo.xml
      - install -Dm644 assets/icon.svg /app/share/icons/hicolor/scalable/apps/remote-app.svg
    sources:
      - type: dir
        path: ../..
