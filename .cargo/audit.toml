# cargo-audit configuration (used by .github/workflows/security.yml).
# Every ignore needs a reason — no silent allowances. Revisit when the
# pinned stack crates ship fixes.
[advisories]
ignore = [
    # hickory-proto is MASTER_PROMPT-pinned (0.24.x); upstream has no
    # patched release yet. DNS responses are only accepted from
    # explicitly configured resolvers, so the O(n^2) decode path is not
    # attacker-controlled by default.
    "RUSTSEC-2026-0119",
    # russh is MASTER_PROMPT-pinned (0.45.x); no patched release yet.
    # Allocation growth is bounded by negotiated frame limits in
    # practice; tracked until upstream ships a fix.
    "RUSTSEC-2026-0154",
    # Same pin story as russh itself (russh-cryptovec 0.7.x).
    "RUSTSEC-2026-0153",
    # rsa Marvin Attack: no patched release. RSA keys are opt-in (the
    # default is Ed25519); the side channel requires a malicious SSH
    # server observing many signatures of the same key.
    "RUSTSEC-2023-0071",
    # time DoS via stack exhaustion: no patched release; the affected
    # parsing path is not reached with attacker-controlled input.
    "RUSTSEC-2026-0009",
    # Unmaintained transitive crates, none of them security-relevant:
    "RUSTSEC-2024-0384", # instant (via dark-light/parking_lot ecosystem)
    "RUSTSEC-2024-0436", # paste (macro helper)
    "RUSTSEC-2026-0206", # rustybuzz (font shaping)
    "RUSTSEC-2026-0192", # ttf-parser (font parsing, via rustybuzz)
]
