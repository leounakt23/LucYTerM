# cargo-audit configuration (used by .github/workflows/security.yml).
# Every ignore needs a reason — no silent allowances. The full advisory
# inventory (including GitHub-only advisories that the RustSec mirror
# does not carry yet) lives in docs/threat_model.md. The russh
# 0.45→0.61.1 migration (2026-10-15) retired the two russh ignores.
[advisories]
ignore = [
    # hickory-proto is MASTER_PROMPT-pinned (0.24.x). A fix exists
    # (0.26.1) but requires rustc >= 1.88 plus a 0.24 -> 0.26
    # resolver-stack bump. DNS responses are only accepted from
    # explicitly configured resolvers, so the O(n^2) decode path is not
    # attacker-controlled by default.
    "RUSTSEC-2026-0119",
    # rsa Marvin Attack: genuinely unpatched (the advisory's
    # `patched = []` is intentional, still affected as of 2026-09).
    # RSA keys are opt-in (the default is Ed25519); the side channel
    # requires a malicious SSH server observing many signatures of the
    # same key.
    "RUSTSEC-2023-0071",
    # time DoS via stack exhaustion: the fix (0.3.47) requires rustc
    # >= 1.88, above the pinned 1.85.1 toolchain (semver-compatible
    # otherwise). The affected parsing path is not reached with
    # attacker-controlled input.
    "RUSTSEC-2026-0009",
    # zip 7.2.0: three extraction advisories published 2026-10-16
    # (RUSTSEC-2026-0367 / -0368 / -0369) against the opt-in
    # crash-reporting stack. zip is pinned by symbolic-debuginfo 12.18.3
    # (`zip = "7.2.0"`), and symbolic never calls the vulnerable
    # `extract()` APIs: it only reads archives from memory
    # (`ZipArchive` over a `Cursor`) and writes source bundles
    # (`ZipWriter`), never materialising attacker-controlled archive
    # paths on disk. No stable symbolic release allows zip >= 9 (latest
    # stable 12.18.3; only 14.0.0-alpha pre-releases exist), so the fix
    # is upstream-gated. Re-check when symbolic 13/14 ships stable.
    "RUSTSEC-2026-0367", # SUID/SGID preservation on extract()
    "RUSTSEC-2026-0368", # symlink targets outside destination on extract()
    "RUSTSEC-2026-0369", # permissions through symlinks on extract()
    # Unmaintained transitive crates, none of them security-relevant:
    "RUSTSEC-2024-0384", # instant (via dark-light/parking_lot ecosystem)
    "RUSTSEC-2024-0436", # paste (macro helper)
    "RUSTSEC-2026-0206", # rustybuzz (font shaping)
    "RUSTSEC-2026-0192", # ttf-parser (font parsing, via rustybuzz)
    # zbus 4.x stack (zbus_names 3.0.0, zvariant 4.2.0, zvariant_derive
    # 4.2.0): unmaintained as of 2026-10-16. Transitive via the pinned
    # GUI stack (iced 0.13 -> dark-light 1.1.1 -> zbus 4.4) and used
    # only for desktop theme detection. Clearing them requires
    # dark-light 3.x and a newer iced — tracked for the next GUI-stack
    # refresh.
    "RUSTSEC-2026-0370", # zvariant
    "RUSTSEC-2026-0371", # zbus_names
    "RUSTSEC-2026-0372", # zvariant_derive
]
