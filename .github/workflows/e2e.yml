name: End-to-end

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ssh-sftp-forwarding:
    runs-on: ubuntu-24.04
    # cold-cache legs measured ~12.6 min (run 38086274044) - too close to
    # 15 min to survive a cache eviction.
    timeout-minutes: 30
    env:
      MBXT_SFTP_TEST_ADDR: 127.0.0.1:2222
      MBXT_SFTP_TEST_USER: test
      MBXT_SFTP_TEST_PASSWORD: test
      MBXT_SSH_TEST_ADDR: 127.0.0.1:2223
      MBXT_SSH_TEST_USER: test
      MBXT_SSH_TEST_PASSWORD: test
      MBXT_FORWARD_TEST_ADDR: 127.0.0.1:2223
      MBXT_FORWARD_TEST_USER: test
      MBXT_FORWARD_TEST_PASSWORD: test
      MBXT_X11_TEST_ADDR: 127.0.0.1:2223
      MBXT_X11_TEST_USER: test
      MBXT_X11_TEST_PASSWORD: test
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libudev-dev libdbus-1-dev busybox xvfb
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: e2e-${{ hashFiles('Cargo.lock') }}
      - name: Start disposable services
        run: docker compose -f docker/compose.e2e.yml up -d --wait --build
      - name: Run live integration tests
        run: |
          cargo test --locked --all-features --test sftp_integration -- --ignored --nocapture
          cargo test --locked --all-features --test ssh_auth_live -- --ignored --nocapture
          cargo test --locked --all-features --test forward_integration -- --ignored --nocapture
          cargo test --locked --all-features --test x11_integration -- --ignored --nocapture
          cargo test --locked --all-features --test telnet_live -- --ignored --nocapture
          MBXT_VNC_TEST_ADDR=127.0.0.1:5901 cargo test --locked --all-features --test vnc_integration -- --ignored --nocapture
          # Clipboard ownership needs any X server (no pointer input, so
          # Xvfb is fine): throwaway writes must lose ownership (documents
          # why the persistent owner exists) and owned writes must survive.
          xvfb-run -a cargo test --locked -p mbxt-system --lib clipboard -- --ignored --nocapture
      - name: Service logs
        if: failure()
        run: docker compose -f docker/compose.e2e.yml logs
      - name: Stop services
        if: always()
        run: docker compose -f docker/compose.e2e.yml down --volumes
