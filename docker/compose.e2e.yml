services:
  ssh:
    image: atmoz/sftp:alpine
    command: test:test:1001::upload
    ports:
      - "2222:22"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 22"]
      interval: 2s
      timeout: 2s
      retries: 20
    tmpfs:
      - /home/test/upload
  # Full OpenSSH server for forwarding/X11 live tests. atmoz/sftp above
  # is an SFTP-only appliance (no TCP forwarding), so the forwarding
  # suites run here instead. The vendored sshd_config enables TCP
  # forwarding and X11 forwarding; password login is test:test.
  # Internal sshd port is 22 (the tests loop back through it); the host
  # mapping is 2223 to coexist with the SFTP appliance.
  openssh:
    image: lscr.io/linuxserver/openssh-server:latest
    ports:
      - "2223:22"
    environment:
      - PUID=1000
      - PGID=1000
      - USER_NAME=test
      - USER_PASSWORD=test
      - PASSWORD_ACCESS=true
    volumes:
      - ./sshd_config:/config/sshd/sshd_config
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 22"]
      interval: 2s
      timeout: 2s
      retries: 20
  # Real RFB server (TigerVNC Xvnc, passwordless) for tests/vnc_integration.rs.
  # Built from the vendored one-line Dockerfile; disposable like the rest.
  # BlacklistTimeout=0 keeps nc healthchecks from poisoning the listener.
  vnc:
    build: ./vnc
    ports:
      - "5901:5901"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 5901"]
      interval: 2s
      timeout: 2s
      retries: 20
  # Real RDP server (xrdp + openbox session) for RDP verification.
  # Credentials: test:test (mirrors the SSH/SFTP services).
  xrdp:
    build: ./xrdp
    ports:
      - "3390:3389"
    healthcheck:
      # no netcat in the image; bash /dev/tcp is the TCP probe
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/127.0.0.1/3389'"]
      interval: 2s
      timeout: 2s
      retries: 20
