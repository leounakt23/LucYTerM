# Edge cases: unknown directives, bad values, Match, secrets, wildcards.
Host edge1
    HostName 192.0.2.60
    User testuser
    Port notaport
    ForwardAgent no
    IdentityFile ~/.ssh/id_ed25519_example
    IdentityFile ~/.ssh/id_rsa_example
    PreferredAuthentications password,publickey
    XSuperSecret hunter2-canary-xyz
    Frobnicator 123

Match host 192.0.2.60
    HostName 192.0.2.99
    Port 9999

Host *.example.com
    HostName 192.0.2.70
    User testuser

Host
    HostName 192.0.2.99

Host !only-negated
    HostName 192.0.2.99
