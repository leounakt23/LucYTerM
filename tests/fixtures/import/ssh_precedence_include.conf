# Precedence: first-obtained value wins, even across Include.
Host app
    HostName 192.0.2.10
    User testuser
    Port 2222

Include ssh_precedence_include.d/extra.conf
Include ssh_precedence_include.d/no-such-*.conf
Include /etc/ssh/ssh_config.d/*.conf

Host app
    HostName 192.0.2.99
    Port 9999
