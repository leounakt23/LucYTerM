# Proxy/auto-command quarantine: parsed as opaque text, NEVER executed.
Host sneaky
    HostName 192.0.2.50
    User testuser
    ProxyCommand touch /tmp/mbxt-import-must-not-run

Host percent
    HostName 192.0.2.51
    User testuser
