# cargo-deny policy: permissive licenses only (tech_stack constraint C4) and
# multiple-versions tolerance tuned down as the graph matures.
[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
# BSL-1.0 (OSI-approved, permissive) covers the Windows clipboard shims:
# clipboard-win and error-code, pulled via copypasta 0.10 and iced_winit
# (both pinned in the authoritative stack).
exceptions = [
    # hexf-parse (CC0-1.0) is naga's hex-float parser inside the pinned
    # wgpu/iced renderer; no replacement within the pinned GUI stack.
    { allow = ["CC0-1.0"], crate = "hexf-parse" },
    # option-ext (MPL-2.0, file-scoped weak copyleft, Windows-only) comes
    # via dirs-sys from the pinned directories 5.0 crate.
    { allow = ["MPL-2.0"], crate = "option-ext" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[advisories]
version = 2
yanked = "deny"
# Every ignore needs a reason. This list mirrors .cargo/audit.toml for
# the crates in cargo-deny's graph; audit.toml additionally carries the
# opt-in-feature zip crate that this graph never reaches (crash
# reporting). The stack crates are MASTER_PROMPT-pinned and upstream has
# no patched releases yet. Unmaintained transitive crates are recorded,
# not hidden. The russh 0.45→0.61.1 migration (2026-10-15) retired the
# two russh ignores.
ignore = [
    # hickory-proto 0.24.x: O(n^2) name compression; resolvers are
    # explicitly configured, decode path not attacker-controlled by default.
    "RUSTSEC-2026-0119",
    # rsa: Marvin Attack; RSA keys are opt-in (default Ed25519).
    "RUSTSEC-2023-0071",
    # time: DoS via stack exhaustion; affected parse path not attacker-fed.
    "RUSTSEC-2026-0009",
    # Unmaintained transitive crates:
    "RUSTSEC-2024-0384", # instant
    "RUSTSEC-2024-0436", # paste
    "RUSTSEC-2026-0206", # rustybuzz
    "RUSTSEC-2026-0192", # ttf-parser
    # zbus 4.x stack via pinned iced 0.13 -> dark-light 1.1.1 (theme
    # detection only; clearing needs dark-light 3.x and a newer iced):
    "RUSTSEC-2026-0370", # zvariant
    "RUSTSEC-2026-0371", # zbus_names
    "RUSTSEC-2026-0372", # zvariant_derive
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
