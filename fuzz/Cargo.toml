doc = false
bench = false

[[bin]]
name = "subnet_parser"
path = "fuzz_targets/subnet_parser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "vte_parser"
path = "fuzz_targets/vte_parser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "config_parser"
path = "fuzz_targets/config_parser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "macro_parser"
path = "fuzz_targets/macro_parser.rs"
test = false
doc = false
bench = false
