[package]
name = "remote-app-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
remote-app = { path = ".." }
mbxt-terminal = { path = "../crates/terminal" }
ron = "0.8"

[[bin]]
name = "ping_parser"
path = "fuzz_targets/ping_parser.rs"
